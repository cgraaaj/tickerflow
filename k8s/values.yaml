replicaCount: 2

image:
  repository: registry.cgraaaj.in/stock-x/tickerflow-svc
  pullPolicy: IfNotPresent
  tag: "9407211"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: "tickerflow-svc-sa"

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false

ingressRoute:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: traefik-external
  entryPoints:
    - websecure
  routes:
    - match: Host(`tickerflow.cgraaaj.in`) && (PathPrefix(`/api`) || PathPrefix(`/admin`) || PathPrefix(`/static`))
      kind: Rule
      services:
        - port: 8000
  tls:
    secretName: "wildcard-cgraaaj-in-tls"

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

livenessProbe:
  httpGet:
    path: /api/v1/health/live/
    port: http
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/v1/health/ready/
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

externalDatabase:
  enabled: true
  host: "10.19.94.40"
  port: 5432

vault:
  enabled: true
  path: "kv-v2"
  addr: "http://hashicorpvault-agent-injector.hashicorp.svc.cluster.local:8200"
  auth:
    role: "tickerflow-svc-role"
  agent:
    limits:
      cpu: "100m"
      memory: "128Mi"
    requests:
      cpu: "10m"
      memory: "64Mi"
  secretVolumePath: "/vault/secrets"
  inject:
    env:
      app-config: "kv-v2/data/tickerflow/app-config"
    secrets:
      db-creds: "database/creds/tickerflow-rw"
    templates:
      app-config: |
        {{- with secret "kv-v2/data/tickerflow/app-config" -}}
        export DJANGO_SECRET_KEY="{{ .Data.data.DJANGO_SECRET_KEY }}"
        {{- end }}
      db-creds: |
        {{- with secret "database/creds/tickerflow-rw" -}}
        export DB_USER="{{ .Data.username }}"
        export DB_PASSWORD="{{ .Data.password }}"
        {{- end }}

runtime:
  sourceInjectedFiles:
    enabled: true
    files:
      - "app-config"
      - "db-creds"

gunicorn:
  # Concurrency math (post-2026-04-19 incident):
  #   in-flight requests per pod = workers * threads
  #   Phase 3 client uses TICKERFLOW_API_CONCURRENCY=40 across all pods.
  #   With replicaCount=2, 2 workers * 8 threads = 16 in-flight per pod
  #   → 32 cluster-wide, leaving headroom for the 80-stock atm-bulk burst.
  #
  # Threads are GIL-bound but Postgres calls release the GIL during
  # network I/O, so this is the right model for a read-mostly DB API.
  # If sustained throughput climbs, prefer scaling replicaCount over
  # threads (CONN_MAX_AGE=300 already keeps a live conn per worker, so
  # adding workers also adds DB connections — verify against PG max_conn
  # or front the DB with pgbouncer in transaction-pool mode).
  workers: 2
  workerClass: gthread
  threads: 8
  timeout: 120
  gracefulTimeout: 30

env:
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "*"
  CSRF_TRUSTED_ORIGINS: "https://tickerflow.cgraaaj.in"
  DB_NAME: "stock-dumps"
  DB_CONN_MAX_AGE: "300"
  # Production cluster has TimescaleDB → run the cagg migration normally.
  DJANGO_SKIP_TS_MIGRATIONS: "0"
  # Observability — set SENTRY_DSN as a secret to enable Sentry; otherwise
  # init is a no-op. SENTRY_RELEASE is injected from the image tag by
  # k8s/templates/deployment.yaml so each rollout is grouped in Sentry.
  SENTRY_ENVIRONMENT: "production"
  SENTRY_TRACES_SAMPLE_RATE: "0.05"

secrets:
  DJANGO_SECRET_KEY: "CHANGE-ME-generate-a-long-random-string"
  DB_PASSWORD: "CHANGE-ME-your-db-password"
